services:
  ocsvm:
    build:
      context: .
      dockerfile: agents/ocsvm/Dockerfile
    container_name: ocsvm
    ports:
      - "8081:8081"
    volumes:
      - ./agents/ocsvm/models:/app/agents/ocsvm/models
    environment:
      AGENT_COST: "0.05"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/a2a/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  lstm-autoencoder:
    build:
      context: .
      dockerfile: agents/lstm_autoencoder/Dockerfile
    container_name: lstm-autoencoder
    ports:
      - "8082:8082"
    volumes:
      - ./agents/lstm_autoencoder/models:/app/agents/lstm_autoencoder/models
    environment:
      AGENT_COST: "0.7"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/a2a/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  wgan-gp:
    build:
      context: .
      dockerfile: agents/wgan_gp/Dockerfile
    container_name: wgan-gp
    ports:
      - "8084:8084"
    volumes:
      - ./agents/wgan_gp/models:/app/agents/wgan_gp/models
    environment:
      AGENT_COST: "1.1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/a2a/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
