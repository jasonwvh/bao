[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator"
version = "0.3.0"
description = "Lean Bayesian Agent Orchestrator runtime"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "torch>=2.1",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8"
]

[project.optional-dependencies]
a2a = [
  # Official SDK (a2aproject/a2a-python). Kept optional because this project
  # can run with HTTP fallback when the SDK is unavailable in local env.
  "a2a-sdk>=0.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*", "agents*"]
