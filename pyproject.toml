[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator"
version = "0.3.0"
description = "Lean Bayesian Agent Orchestrator runtime"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.3.3",
  "scikit-learn==1.6.1",
  "scipy==1.13.1",
  "PyYAML==6.0.2",
  "torch==2.8.0",
  "httpx==0.27.2",
  "fastapi==0.115.12",
  "uvicorn==0.30.6",
  "pydantic==2.8.2"
]

[project.optional-dependencies]
a2a = [
  # Official SDK (a2aproject/a2a-python). Kept optional because this project
  # can run with HTTP fallback when the SDK is unavailable in local env.
  "a2a-sdk>=0.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestrator*", "agents*"]
