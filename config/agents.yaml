version: v1
agents:
  - id: ocsvm
    enabled: true
    endpoint: http://localhost:8081
    transport: http-json
    timeout_ms: 1500
    cost: 0.05
    capabilities: [flow_tabular, unsw_nb15, anomaly_score, one_class]
    health_path: /a2a/health
    infer_path: /a2a/infer
    capabilities_path: /a2a/capabilities
    meta:
      tier: cheap

  - id: lstm_autoencoder
    enabled: true
    endpoint: http://localhost:8082
    transport: http-json
    timeout_ms: 1800
    cost: 0.7
    capabilities: [flow_tabular, unsw_nb15, anomaly_score, temporal]
    health_path: /a2a/health
    infer_path: /a2a/infer
    capabilities_path: /a2a/capabilities
    meta:
      tier: deep

  - id: wgan_gp
    enabled: true
    endpoint: http://localhost:8084
    transport: http-json
    timeout_ms: 2200
    cost: 1.1
    capabilities: [flow_tabular, unsw_nb15, anomaly_score, generative_anomaly]
    health_path: /a2a/health
    infer_path: /a2a/infer
    capabilities_path: /a2a/capabilities
    meta:
      tier: gan

routing:
  default_agents: [ocsvm, lstm_autoencoder, wgan_gp]
  require_healthy: true
  max_parallel: 1
  fallback_strategy: skip_unhealthy
