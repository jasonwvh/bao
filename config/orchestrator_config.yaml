thresholds:
  p_accept: 0.45
  p_reject: 0.55
  uncertainty: 0.85

costs:
  c_fn: 500.0
  c_fp: 5.0
  c_h: 5000.0

orchestration:
  max_iterations: 2
  learning_rate: 1.0
  seed: 7
  agent_registry_path: agents.yaml

preprocessing:
  schema_path: ../agents/lstm_autoencoder/models/lstm_autoencoder.schema.json

a2a:
  retries: 0
  a2a_version: v1

state:
  sqlite_path: artifacts/state/bao_state.sqlite

voi:
  use_surrogate: true
  allow_exact: true

drift:
  window: 20
  threshold: 0.08

logging:
  jsonl_path: artifacts/replay/flows.jsonl
  enable_mlflow: false
