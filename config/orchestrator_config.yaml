thresholds:
  p_accept: 0.30
  p_reject: 0.70
  uncertainty: 0.85

costs:
  c_fn: 50.0
  c_fp: 5.0
  c_h: 500.0

orchestration:
  max_iterations: 2
  learning_rate: 0.35
  seed: 7
  agent_registry_path: agents.yaml

a2a:
  retries: 0
  a2a_version: v1

state:
  sqlite_path: artifacts/state/bao_state.sqlite

voi:
  use_surrogate: true
  allow_exact: false

drift:
  window: 20
  threshold: 0.08

logging:
  jsonl_path: artifacts/replay/flows.jsonl
  enable_mlflow: false