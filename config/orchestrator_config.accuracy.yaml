orchestration:
  seed: 7
  agent_registry_path: agents.yaml
  update_mode: posterior_first
  engine: deterministic
  first_agent_strategy: dynamic_cheapest
  agent_sequence: [ocsvm, lstm_autoencoder, wgan_gp]

belief:
  prior_attack_rate: 0.5
  eps: 1.0e-6
  likelihood_sanity_gate: true

fusion:
  method: handoff_latest
  agent_weights:
    ocsvm: 1.0
    lstm_autoencoder: 1.0
    wgan_gp: 1.0

decision:
  policy: expected_cost_min
  costs:
    c_fn: 500.0
    c_fp: 20.0
    c_h: 1000.0
  accuracy_floor_delta: 0.01
  cost_calibration:
    enabled: false
    mode: validation_derived
    fusion_method: handoff_latest
    c_fn_grid: [25.0, 50.0, 100.0, 200.0, 500.0]
    c_fp_grid: [1.0, 2.0, 5.0, 10.0]
    c_h_grid: [100.0, 500.0, 1000.0, 5000.0]
    min_expected_gain_grid: [0.0, -0.5, -1.0, -2.0, -3.0, -5.0, -10.0]
    max_agents_grid: [1, 2, 3]

query:
  policy: adaptive_router
  first_agent: ocsvm
  uncertainty_threshold: 0.646
  apply_uncertainty_gate_in_adaptive: true
  max_agents: 3
  min_expected_gain: -0.5
  force_under_target_topup: false
  exploration_enabled: false
  exploration_seed: 7
  exploration_base_rate: 0.0
  exploration_max_rate: 0.0
  exploration_uncertainty_threshold: 0.646
  escalation_ordered: true
  utilization_warmup_flows: 500
  utilization_targets: []

voi:
  enabled: false
  rho: 0.7

routing:
  profile_path: ../artifacts/replay/router_profile.json
  bin_count: 20
  min_samples_per_bin: 20
  tie_break: agent_sequence
  langgraph_perf_guardrail_overhead: 0.05
  parity_tolerance: 1.0e-6

benchmark:
  reset_state: true
  prediction_source: decision
  write_manifest: true

preprocessing:
  schema_path: ../agents/lstm_autoencoder/models/lstm_autoencoder.schema.json

a2a:
  retries: 0
  a2a_version: v1

state:
  sqlite_path: ../artifacts/state/bao_state.sqlite

logging:
  jsonl_path: ../artifacts/replay/flows.jsonl
  enable_mlflow: false
