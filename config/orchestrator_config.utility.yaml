orchestration:
  seed: 7
  agent_registry_path: agents.yaml
  update_mode: posterior_first
  engine: deterministic
  first_agent_strategy: explicit
  agent_sequence: [ocsvm, lstm_autoencoder]

belief:
  prior_attack_rate: 0.5
  eps: 1.0e-6
  likelihood_sanity_gate: true

fusion:
  method: utility_select
  uncertainty_weight_gamma: 1.5
  weight_floor: 0.1
  agent_weights:
    ocsvm: 0.6
    lstm_autoencoder: 1.4
    wgan_gp: 1.0

decision:
  policy: expected_cost_min
  costs:
    c_fn: 25.0
    c_fp: 2.0
    c_h: 2.0
  defer_policy:
    enabled: true
    uncertainty_threshold: 0.69308
    margin_from_half: 0.01
    require_all_agents_exhausted: true

query:
  policy: adaptive_router
  first_agent: ocsvm
  uncertainty_threshold: 0.60
  exploration_uncertainty_threshold: 0.60
  apply_uncertainty_gate_in_adaptive: true
  max_agents: 2
  min_expected_gain: -3.00
  force_under_target_topup: false
  exploration_enabled: false
  escalation_ordered: true
  utilization_warmup_flows: 0
  utilization_targets: []

routing:
  profile_path: ../artifacts/replay/matrix/router_profile.json
  min_samples_per_bin: 20

benchmark:
  reset_state: true
  prediction_source: decision
  utility_evaluation: cost_action_parity
  write_manifest: true

preprocessing:
  schema_path: ../agents/lstm_autoencoder/models/lstm_autoencoder.schema.json

a2a:
  retries: 0

state:
  sqlite_path: ../artifacts/state/bao_state.sqlite

logging:
  jsonl_path: ../artifacts/replay/flows.jsonl
