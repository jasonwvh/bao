orchestration:
  seed: 7
  agent_registry_path: agents.yaml
  update_mode: posterior_first
  engine: deterministic
  first_agent_strategy: dynamic_cheapest
  agent_sequence: [ocsvm, lstm_autoencoder]

belief:
  prior_attack_rate: 0.5
  eps: 1.0e-6
  likelihood_sanity_gate: true

fusion:
  method: handoff_latest
  uncertainty_weight_gamma: 1.5
  weight_floor: 0.1
  agent_weights:
    ocsvm: 1.0
    lstm_autoencoder: 1.0
    wgan_gp: 1.0

decision:
  policy: expected_cost_min
  costs:
    c_fn: 25.0
    c_fp: 1.0
    c_h: 100.0
  defer_policy:
    enabled: true
    uncertainty_threshold: 0.66
    margin_from_half: 0.08
    require_all_agents_exhausted: true
  accuracy_floor_delta: 0.01
  cost_calibration:
    enabled: false
    mode: validation_derived
    fusion_method: handoff_latest
    c_fn_grid: [25.0, 50.0, 100.0, 200.0]
    c_fp_grid: [0.5, 1.0, 2.0, 5.0]
    c_h_grid: [1.0, 2.0, 5.0, 10.0, 20.0]
    min_expected_gain_grid: [-2.6, -2.7, -2.8, -2.9, -3.0]
    max_agents_grid: [2]
    uncertainty_threshold_grid: [0.60, 0.62, 0.64]
    defer_uncertainty_threshold_grid: [0.65, 0.66, 0.67]
    defer_margin_grid: [0.06, 0.08, 0.10]

query:
  policy: adaptive_router
  first_agent: ocsvm
  uncertainty_threshold: 0.62
  apply_uncertainty_gate_in_adaptive: true
  max_agents: 2
  min_expected_gain: -2.9
  force_under_target_topup: false
  exploration_enabled: false
  exploration_seed: 7
  exploration_base_rate: 0.0
  exploration_max_rate: 0.0
  exploration_uncertainty_threshold: 0.62
  escalation_ordered: true
  utilization_warmup_flows: 0
  utilization_targets: []

voi:
  enabled: false
  rho: 0.7

routing:
  profile_path: ../artifacts/replay/router_profile.json
  bin_count: 20
  min_samples_per_bin: 20
  tie_break: agent_sequence
  langgraph_perf_guardrail_overhead: 0.05
  parity_tolerance: 1.0e-6

benchmark:
  reset_state: true
  prediction_source: decision
  utility_evaluation: cost_action_parity
  write_manifest: true

preprocessing:
  schema_path: ../agents/lstm_autoencoder/models/lstm_autoencoder.schema.json

a2a:
  retries: 0
  a2a_version: v1

state:
  sqlite_path: ../artifacts/state/bao_state.sqlite

logging:
  jsonl_path: ../artifacts/replay/flows.jsonl
  enable_mlflow: false
